name: Test Build

on:
  workflow_dispatch:

jobs:
  ninja_build:
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout upstream at tag
        uses: actions/checkout@v7
        with:
          repository: meganz/MEGAsync
          ref: v6.6.1.0_Win
          path: build-src

      - name: Init submodules
        working-directory: build-src
        run: |
          git rm --cached src/DesignTokensImporter/megadesignassets
          git submodule update --init --recursive --depth 1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          cache: true

      - name: Apply Patches
        shell: bash
        run: |
          mkdir vcpkg_cache
          cd build-src
          git apply --ignore-whitespace "${{ github.workspace }}/MEGAsync.patch"
          cd src/MEGASync/mega
          git apply --ignore-whitespace "${{ github.workspace }}/SDK.patch"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Generate Ninja
        working-directory: build-src
        shell: cmd
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
        run: |
          cmake ^
           	-G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
           	-DCMAKE_SYSTEM_VERSION=10.0.22621.0 ^
           	-DCMAKE_VERBOSE_MAKEFILE="ON" ^
           	-DENABLE_DESIGN_TOKENS_IMPORTER="OFF" ^
           	-DENABLE_DESKTOP_APP_TESTS="OFF" ^
           	-DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELWITHDEBINFO=OFF ^
           	-DCMAKE_CXX_FLAGS_RELWITHDEBINFO="/Gw /GS- /O2 /Ob2 /DNDEBUG /utf-8" ^
           	-DCMAKE_C_FLAGS_RELWITHDEBINFO="/Gw /GS- /O2 /Ob2 /DNDEBUG /utf-8" ^
           	-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO="/DEBUG /INCREMENTAL:NO /PDBALTPATH:%25_PDB%25 /OPT:ICF=3 /OPT:REF" ^
           	-DVCPKG_ROOT=%VCPKG_INSTALLATION_ROOT% ^
           	-DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% ^
           	-DCMAKE_C_COMPILER_LAUNCHER=sccache ^
           	-DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
           	-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
           	-DCMAKE_POLICY_DEFAULT_CMP0141=NEW ^
           	-S . ^
           	-B build-x64-windows-mega

      - uses: actions/upload-artifact@v7
        with:
          name: Ninja project
          path: build-src/build-x64-windows-mega/src

      - name: Build with CMake
        env:
          SCCACHE_LOG: debug
          SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
        working-directory: build-src
        run: |
          cmake --build build-x64-windows-mega --target MEGAsync -j

      - name: Upload sccache error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log
          path: ${{ github.workspace }}/sccache.log

      - uses: actions/upload-artifact@v7
        with:
          name: MEGAsync binary
          path: build-src/build-x64-windows-mega/src/MEGASync/MEGAsync.*

  msbuild_build:
    if: false
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: 'true'
